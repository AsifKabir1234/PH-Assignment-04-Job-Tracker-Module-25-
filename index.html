<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker</title>

    <!-- Daisy UI and Tailwinds CDN Links -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Googel Fonts Links -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- Font Awesom CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">

    
</head>
<body class="max-w-[1110px] mx-auto bg-green-100 py-10">

    <header class="space-y-10">
        <h1 class="text-5xl font-bold pl-5">Job Tracker Tracker</h1>

        <div class="grid grid-cols-3 pl-8">
            <div class="space-y-3">
                <h2 class="text-2xl font-semibold">Total</h2>
                <p class="text-3xl font-bold">8</p>
            </div>

             <div class="space-y-3">
                <h2 class="text-2xl font-semibold">Interview</h2>
                <p class="text-3xl font-bold text-green-500">0</p>
            </div>

             <div class="space-y-3">
                <h2 class="text-2xl font-semibold">Rejected</h2>
                <p class="text-3xl font-bold text-red-600">0</p>
            </div>
        </div>

        <hr class="max-w-11/12 mx-auto">
    </header>



    <section class="mt-8 space-y-5">
        <div class="flex justify-between items-center p-5">
            <h2 class="text-3xl font-bold">Available Jobs</h2>

            <p class="text-2xl font-bold text-neutral/50">8 Jobs</p>
        </div>

        <div class="m-5 flex gap-5">
            <button class="btn btn-dash btn-primary py-6 px-10 text-xl">All</button>
            <button class="btn btn-dash btn-primary py-6 px-10 text-xl">Interview</button>
            <button class="btn btn-dash btn-primary py-6 px-10 text-xl">Rejected</button>
        </div>
    </section>


    <section class="mt-8 space-y-5">
        <div class="m-5 space-y-3 px-8 py-5 text-xl border-2 rounded-2xl bg-green-200">
            <h2 class="text-2xl font-bold">Mobile First Corp</h2>

            <h3>React Native Developer</h3>

            <div class="flex gap-8">
                <li class="list-none">Remote</li>
                <li>Full-Time</li>
                <li>$130,000 - $175,000</li>
            </div>

            <button class="btn btn-soft p-5 text-xl">NOT APPLIED</button>

            <p>Build cross-platform mobile applications using React Native. Work on products used by millions of users worldwide.</p>

            <div class="flex gap-5">
                <button class="btn p-5 text-xl text-green-500 border-3 border-green-500">INTERVIEW</button>
                <button class="btn p-5 text-xl text-red-600 border-3 border-red-600">REJECTED</button>
            </div>
        </div>

    </section>
</body>
</html>
